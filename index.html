<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DIRECTION VERS TOI</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5efe6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Direction">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f5efe6;--card:#fffbf4;--card2:#efe4d2;--line:#e0d1b8;--txt:#2b2018;--mute:#7a6a58;--vio:#9a7430;--vio2:#8a6a2a;--gold:#d4ab55;--ok:#3f9a6e;--warn:#c8743c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
body{background:radial-gradient(900px 500px at 50% -120px,#eadbc0 0,transparent 70%),var(--bg);min-height:100vh}
body.lock{overflow:hidden}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--vio2);margin:0;font-weight:700}
h2{font-size:22px;margin:2px 0 4px;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:600}
p{margin:0 0 8px}
.mute{color:var(--mute)}
.small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.hero{background:linear-gradient(135deg,#f1e4cc,#fffbf4);border-color:#d9c39a}
.hero .quote{font-size:15px;color:#5a4632;font-style:italic}
.now{border-color:var(--vio);box-shadow:0 0 0 1px var(--vio) inset}
.btn{display:inline-block;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;background:var(--vio);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:99px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--vio);border-color:var(--vio);color:#fff}
input,textarea,select{width:100%;background:#fffbf4;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.btn{flex:none}
.bar{height:9px;background:#e6d8be;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--vio2));border-radius:9px}
.bar.over>i{background:linear-gradient(90deg,var(--warn),#f5c26b)}
.blk{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 6px}
.blk b{font-size:17px}
.step{display:flex;gap:12px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0}
.step.done{opacity:.7}
.step.rep{opacity:.55}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--vio);flex:none;margin-top:2px;display:grid;place-items:center;font-size:14px;color:#fff}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#06241a}
.step.rep .dot{border-style:dashed;border-color:var(--mute)}
.step .t{font-weight:600}
.step .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.link{background:none;border:0;color:var(--vio2);font:inherit;font-size:13px;padding:4px 2px;cursor:pointer;text-decoration:underline}
nav{position:fixed;left:0;right:0;bottom:0;background:#f5efe6ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--vio2);font-weight:600}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sheet .in{max-width:560px;margin:0 auto;padding:16px 16px 180px}
.sheet .close{float:right}
.topbar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);margin:-16px -16px 14px;padding:12px 16px;border-bottom:1px solid var(--line)}
.topbar .btn{flex:none}
button,.btn,.chip{touch-action:manipulation}
.sheet .bottom{margin-top:26px}
.err{background:#fbe3d6;border:1px solid var(--warn);color:#7a2e12;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.err[hidden]{display:none}
input.bad,textarea.bad{border-color:var(--warn)}
audio{width:100%;height:40px;margin-top:6px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #c9a24a99}50%{box-shadow:0 0 0 12px #c9a24a00}}
.btn.rec{background:#e5484d}
.modal{position:fixed;inset:0;background:rgba(40,28,16,.55);z-index:30;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .box{background:linear-gradient(160deg,#f5ead6,#fffbf4);border:1px solid var(--vio);border-radius:24px;padding:28px 22px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 80px #c9a24a55}
.modal .em{font-size:64px;line-height:1.1;margin-bottom:6px}
.mirror{font-size:24px;font-weight:600;text-align:center;padding:32px 10px;line-height:1.35;color:#3a2c1e}
.circle-wrap{display:grid;place-items:center;height:260px}
#bcircle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efd89a,#b08a3e 70%);transform:scale(.55);display:grid;place-items:center;box-shadow:0 0 60px #c9a24a66}
#blabel{font-weight:700;font-size:18px;text-align:center}
#bcount{font-size:28px;font-weight:700}
.tdisp{font-size:54px;font-weight:700;text-align:center;margin:18px 0;letter-spacing:.02em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .h{font-size:11px;color:var(--mute);text-align:center}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-size:14px;cursor:pointer;display:grid;place-items:center;position:relative}
.cell.empty{border:0;background:none;cursor:default}
.cell.today{border-color:var(--vio2);border-width:2px}
.cell.full{background:var(--vio);border-color:var(--vio);color:#fff;font-weight:700}
.cell.full::after{content:"✓";position:absolute;right:4px;top:0;font-size:10px}
.cell.rep{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:700}
.cell.most{background:#e3cfa0;border-color:#c9a24a}
.cell.some{background:#ebddc3}
.cell.sel{outline:2px solid var(--vio2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.proof{padding:11px 0;border-bottom:1px solid var(--line)}
.proof:last-child{border:0}
.proof .d{font-size:12px;color:var(--mute)}
.q{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.q:last-child{border:0}
.q .heart{background:none;border:0;font-size:22px;color:var(--mute);cursor:pointer;padding:0 2px}
.q .heart.on{color:#ff6b9a}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fffbf4;border:1px solid var(--vio);padding:10px 16px;border-radius:99px;z-index:20;font-size:14px;max-width:90%;text-align:center}
details summary{cursor:pointer;color:var(--vio2);font-size:14px}
a{color:var(--vio2)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<nav id="nav"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>

<script>
(function(){
'use strict';

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const today=()=>ymd(new Date());
const mkey=s=>s.slice(0,7);
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const hashStr=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);};

/* ---------- contenu ---------- */
const BLOCKS=[
 {id:'matin',name:'Matin',icon:'🌅',tk:'matin',steps:[
  {id:'miroir',t:'Devant le miroir',min:2,short:1,sub:'Dire à voix haute mes phrases d’identité'},
  {id:'respi',t:'Respiration',min:2,short:1,sub:'Selon comment je me sens'},
  {id:'podcast',t:'Podcast ou vidéo',min:4,short:2,sub:'Développement personnel & manifestation'},
  {id:'objectif',t:'Mon objectif du jour',min:2,short:1,sub:'Une seule chose concrète à accomplir'}]},
 {id:'midi',name:'Midi',icon:'☀️',tk:'midi',steps:[
  {id:'visu',t:'Méditation & visualisation',min:8,short:3,sub:'Installé·e confortablement, avec ma musique'},
  {id:'bizz',t:'Une action pour mon grand projet',min:5,short:2,sub:'Une seule petite action concrète'}]},
 {id:'soir',name:'Soir',icon:'🌙',tk:'soir',steps:[
  {id:'sport',t:'Sport guidé à la maison',min:20,short:8,sub:'Vidéo adaptée à ma fatigue',tk:'sport'},
  {id:'famille',t:'Devoirs des enfants & douche',min:0,short:0,sub:'Mon temps famille',family:true},
  {id:'bilan',t:'Bilan de mon objectif',min:2,short:1,sub:'Ai-je atteint ce que j’avais fixé ?'},
  {id:'medit',t:'Méditation avant de dormir',min:8,short:3,sub:'Guidée, manifestation'}]}
];
const STEPS=BLOCKS.reduce((a,b)=>a.concat(b.steps.map(s=>Object.assign({block:b.id},s))),[]);
const REQUIRED=STEPS.filter(s=>!s.family);
const STEP=id=>STEPS.find(s=>s.id===id);
const PRIO=['medit','visu','bizz','sport','bilan','objectif','podcast','respi','miroir'];

const BREATH={
 stress:{l:'Stress, tension',inh:4,hold:0,exh:6,tip:'Expire plus longtemps que tu n’inspires : ton corps comprend qu’il peut se poser.'},
 fatigue:{l:'Fatigue',inh:4,hold:0,exh:4,tip:'Respire dans le ventre, régulièrement, pour te redonner de l’énergie sans forcer.'},
 colere:{l:'Colère',inh:4,hold:2,exh:8,tip:'Laisse sortir l’air lentement, comme si tu soufflais sur une bougie.'},
 tristesse:{l:'Tristesse',inh:4,hold:2,exh:6,tip:'Pose une main sur ton cœur et accueille ce que tu ressens.'},
 confiance:{l:'Manque de confiance',inh:4,hold:4,exh:4,hold2:4,tip:'Respiration carrée : stable comme un ancrage. Redresse les épaules.'},
 surcharge:{l:'Tête trop pleine',inh:4,hold:0,exh:7,tip:'À chaque expiration, imagine poser une pensée sur une étagère.'},
 calme:{l:'Je me sens bien',inh:5,hold:0,exh:5,tip:'Cohérence : cinq secondes d’inspiration, cinq d’expiration.'}
};

const PILIERS=[
 {id:'projet',t:'Mon projet',d:'Faire avancer ce qui compte pour ma vie professionnelle ou mes envies.'},
 {id:'soin',t:'Prendre soin de moi',d:'Mon corps, mon sommeil, mon énergie, mon bien-être.'},
 {id:'estime',t:'Me retrouver',d:'Mon estime de moi, ma sérénité, mon identité.'},
 {id:'argent',t:'Mon argent',d:'Ma stabilité et ma liberté financière.'}
];
const OBJ={
 projet:['Avancer mon projet de 15 minutes','Envoyer 1 message important','Préparer ma journée de demain'],
 soin:['Boire 2 litres d’eau','Marcher 15 minutes dehors','Prendre un vrai repas, sans écran'],
 estime:['Écrire 3 lignes pour moi','Faire une chose juste pour moi','Noter une preuve de ma valeur'],
 argent:['Regarder mes comptes 10 minutes','Mettre de côté un petit montant','Lire 10 pages sur l’argent']
};
const BIZ={
 'Mon projet':['Avancer 15 minutes sur mon projet','Contacter 1 personne utile','Écrire ma prochaine étape'],
 'Mes apprentissages':['Lire ou écouter 10 minutes','Noter 1 idée à appliquer','Tester 1 nouvelle chose'],
 'Mon organisation':['Ranger mon plan de la semaine','Faire 1 tâche que je repousse','Répondre à 1 message en attente']
};
const SPORT={
 fatiguee:[['Étirements et yoga doux','yoga doux 20 minutes'],['Pilates doux au sol','pilates doux 20 minutes']],
 moyenne:[['Pilates 20 minutes','pilates 20 minutes maison'],['Renforcement corps entier sans matériel','renforcement musculaire 20 minutes sans matériel'],['Barre au sol et gainage','pilates tonique 20 minutes']],
 forme:[['Cardio sans saut','cardio sans saut 20 minutes'],['Cardio dynamique débutant','cardio hiit 20 minutes débutant'],['Danse cardio','danse cardio 20 minutes']]
};
const PODCASTS=[['Développement personnel','développement personnel podcast français'],['Manifestation et état d’esprit','manifestation état d’esprit podcast français'],['Confiance en soi','confiance en soi podcast français'],['Habitudes et discipline','habitudes discipline podcast français']];
const MEDIT_Q=[['Méditation guidée manifestation du soir','méditation guidée manifestation avant de dormir'],['Gratitude et nouvelle identité','méditation guidée nouvelle identité sommeil']];
const QUOTES=[
 {id:'q1',a:'Pour toi',t:'Je n’ai pas besoin d’être parfait·e pour avancer : un petit pas aujourd’hui compte.'},
 {id:'q2',a:'Pour toi',t:'Je deviens, jour après jour, la personne que je décide d’être.'},
 {id:'q3',a:'Pour toi',t:'Mon passé m’a appris, il ne décide pas de mon avenir.'},
 {id:'q4',a:'Pour toi',t:'Je choisis mes pensées comme je choisis mes actions : avec intention.'},
 {id:'q5',a:'Pour toi',t:'Chaque petite preuve construit ma nouvelle identité.'},
 {id:'q6',a:'Pour toi',t:'Je mérite le calme, la réussite et la joie.'}
];
const MSG={
 good:['Tu es sur la bonne voie. Chaque rituel tenu est une preuve de plus que tu deviens cette personne.','Ta constance parle pour toi : continue, doucement et sûrement.','Bonne direction ✨ Ton système te porte. Ne change rien et savoure.'],
 mid:['Tu avances, et c’est ça qui compte. On ajuste un détail : raccourcis un rituel plutôt que de le sauter.','Tu es en chemin. Garde le matin intact, le reste peut passer en version courte.','Pas de pression : un rituel court vaut mieux qu’un rituel manqué.'],
 low:['On allège. Ton système est là pour te soutenir, pas pour t’écraser. Passe en version courte quelques jours.','Cette semaine a été dense, ce n’est pas un échec. Reviens à l’essentiel : miroir et objectif du jour.','On repart en douceur. Une seule petite victoire aujourd’hui suffit.']
};
const BILAN_MSG={oui:'Bravo. Tu as tenu ta parole envers toi-même, c’est exactement ça, l’identité.',partiel:'Tu as avancé, et avancer compte. Qu’est-ce qui a bien marché ?',non:'Ça arrive, sans jugement. Demain matin, on repart avec un objectif plus petit.'};

/* ---------- état ---------- */
const DEF=()=>({
 settings:{times:{matin:'06:45',midi:'12:30',sport:'19:00',soir:'22:30'},wake:'06:45',bed:'23:00',limit:75,identity:'',name:'',song:'',first:today(),onboarded:false},
 phrases:[],favs:[],imported:[]
});
let S=DEF();
let months={};
const ui={tab:'today',sheet:null,cal:mkey(today()),selday:null,bs:'stress',fat:'moyenne',axe:'Mon projet',mi:0,bilan:null};

function dayOf(date,create){
 const mk=mkey(date);let m=months[mk];
 if(!m){if(!create)return null;m=months[mk]={days:{}};}
 let d=m.days[date];
 if(!d){if(!create)return null;d=m.days[date]={};}
 if(!d.done)d.done={};if(!d.short)d.short={};if(!d.rep)d.rep={};if(!d.proofs)d.proofs=[];
 return d;
}
const isDone=(d,id)=>!!(d&&d.done&&d.done[id]);
const isRep=(d,id)=>!!(d&&d.rep&&d.rep[id]);
function minFor(d,s){return d&&d.short&&d.short[s.id]?s.short:s.min;}
function planned(d,rat){
 let n=REQUIRED.reduce((a,s)=>a+(isRep(d,s.id)?0:minFor(d,s)),0);
 if(rat&&!rat.done)n+=5;
 return n;
}

/* ---------- sauvegarde ---------- */
const sync={db:null,uid:null,status:'local',dirty:new Set(),timer:null,busy:false,seeded:false};
const LS='dvt_public_v1';
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify({S:S,months:months}));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS);if(!r)return;const o=JSON.parse(r);if(o&&o.S){S=normSettings(o.S);}if(o&&o.months)months=o.months;}catch(e){}}
function normSettings(o){
 const d=DEF();
 const s=Object.assign({},d.settings,o.settings||{});
 s.times=Object.assign({},d.settings.times,(o.settings||{}).times||{});
 return {settings:s,phrases:Array.isArray(o.phrases)&&o.phrases.length?o.phrases:d.phrases,favs:o.favs||[],imported:o.imported||[]};
}
function setStatus(s){sync.status=s;const b=$('#badge');if(b)b.textContent=badgeText();}
function badgeText(){return {local:'📱 Sur cet appareil',saving:'☁ Enregistrement…',ok:'☁ Synchronisé',error:'⚠ Sauvegarde en attente',slow:'☁ Connexion lente…'}[sync.status]||'';}
function mark(key){
 cacheLocal();
 if(!sync.db){return;}
 sync.dirty.add(key);setStatus('saving');
 clearTimeout(sync.timer);sync.timer=setTimeout(flush,700);
}
function touchDay(date){mark('d-'+mkey(date));}
function saveMain(){mark('main');}
async function flush(){
 if(!sync.db)return;
 if(sync.busy){clearTimeout(sync.timer);sync.timer=setTimeout(flush,700);return;}
 sync.busy=true;let key=null;
 try{
  while(sync.dirty.size){
   key=sync.dirty.values().next().value;sync.dirty.delete(key);
   const data=key==='main'?{settings:S.settings,phrases:S.phrases,favs:S.favs,imported:S.imported}:{days:(months[key.slice(2)]||{days:{}}).days};
   await sync.db.collection('data/users/'+sync.uid).doc(key).set(JSON.parse(JSON.stringify(data)));
  }
  setStatus('ok');
 }catch(e){
  if(key)sync.dirty.add(key);
  setStatus('error');clearTimeout(sync.timer);sync.timer=setTimeout(flush,8000);
 }
 sync.busy=false;
}
function applyRemote(snap){
 if(sync.dirty.size||sync.busy)return;
 if(snap.empty){
  if(!snap.metadata.fromCache&&!sync.seeded){sync.seeded=true;mark('main');Object.keys(months).forEach(k=>mark('d-'+k));}
  return;
 }
 snap.docs.forEach(doc=>{
  const d=JSON.parse(JSON.stringify(doc.data()||{}));
  if(doc.id==='main'){S=normSettings(d);}
  else if(doc.id.indexOf('d-')===0){months[doc.id.slice(2)]={days:d.days||{}};}
 });
 cacheLocal();
 if(!ui.sheet)render();
 if(!snap.metadata.fromCache)setStatus('ok');
}
async function initSync(){
 try{
  if(typeof claude==='undefined'||!claude.use)return;
  const db=await claude.use('db'),user=await claude.use('user');
  if(!db||!user)return;
  const uid=await user.id();
  if(!uid)return;
  sync.db=db;sync.uid=uid;setStatus('slow');
  const t=setTimeout(()=>setStatus('slow'),10000);
  db.collection('data/users/'+uid).onSnapshot(snap=>{clearTimeout(t);applyRemote(snap);},()=>{clearTimeout(t);setStatus('error');});
 }catch(e){setStatus('local');}
}

/* ---------- logique ---------- */
function rattrapage(){
 const t=today(),y=addDays(t,-1);
 if(y<S.settings.first)return null;
 const td=dayOf(t,false);
 if(td&&td.rattrape)return {done:true,step:td.rattrape.step,from:td.rattrape.from};
 const yd=dayOf(y,false);
 const miss=PRIO.filter(id=>!isDone(yd,id));
 if(!miss.length)return null;
 return {done:false,step:miss[0],from:y,missed:miss.length};
}
function dayStatus(date){
 const d=dayOf(date,false);if(!d)return '';
 const n=REQUIRED.filter(s=>isDone(d,s.id)).length;
 if(n===REQUIRED.length){return REQUIRED.some(s=>d.done[s.id]==='rattrape')?'rep':'full';}
 if(n/REQUIRED.length>=0.6)return 'most';
 return n>0?'some':'';

function boussole(){
 const t=today();let tot=0,done=0,days=0,proofs=0;
 for(let i=1;i<=7;i++){
  const ds=addDays(t,-i);if(ds<S.settings.first)break;
  days++;const d=dayOf(ds,false);
  REQUIRED.forEach(s=>{tot++;if(d&&isDone(d,s.id))done++;});
  proofs+=d?d.proofs.length:0;
 }
 if(!days)return {kind:'start',msg:'Premier jour : on commence doucement. Ta boussole se calculera chaque semaine d’après tes rituels et tes preuves.'};
 const r=done/tot;
 const kind=r>=0.75?'good':r>=0.45?'mid':'low';
 const arr=MSG[kind];const msg=arr[hashStr(t)%arr.length];
 return {kind:kind,msg:msg,pct:Math.round(r*100),days:days,proofs:proofs};
}
function allProofs(){

 Object.keys(months).forEach(mk=>{const ds=months[mk].days||{};Object.keys(ds).forEach(date=>{(ds[date].proofs||[]).forEach(p=>out.push({date:date,t:p.t,auto:!!p.auto}));});});

 return out;
}

const audio={clips:[],urls:{},rec:null,status:'idle',draft:null,draftUrl:'',t0:0,iv:null,err:'',fallback:false,db:null};

function idb(){
 return new Promise((res,rej)=>{
  if(audio.db)return res(audio.db);
  if(!window.indexedDB)return rej(new Error('no idb'));
  const r=window.indexedDB.open('dvt_audio',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('clips',{keyPath:'id'});};
  r.onsuccess=()=>{audio.db=r.result;res(r.result);};
  r.onerror=()=>rej(r.error);
 });
}
function idbAll(){return idb().then(db=>new Promise((res,rej)=>{const q=db.transaction('clips','readonly').objectStore('clips').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);}));}
function idbPut(c){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').put(c);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}
function idbDel(id){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);}));}

function clipUrl(c){if(!audio.urls[c.id])audio.urls[c.id]=URL.createObjectURL(c.blob);return audio.urls[c.id];}
function pickMime(){if(!window.MediaRecorder)return '';const L=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];for(let i=0;i<L.length;i++){try{if(MediaRecorder.isTypeSupported(L[i]))return L[i];}catch(e){}}return '';}

  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=pickMime(),rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream),chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=()=>{
   stream.getTracks().forEach(t=>t.stop());clearInterval(audio.iv);
   const dur=Math.max(1,Math.round((Date.now()-audio.t0)/1000));
   audio.rec=null;setDraft(new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'}),dur);
  };
  audio.rec=rec;audio.t0=Date.now();rec.start();audio.status='rec';
  audio.iv=setInterval(()=>{const s=Math.round((Date.now()-audio.t0)/1000),el=$('#rectime');if(el)el.textContent=fmtDur(s);if(s>=300)stopRec();},500);

function phase(id,label,sec,scale){
 return new Promise(res=>{
  const c=$('#bcircle');if(id!==breathRun||!c)return res(false);
  $('#blabel').textContent=label;
  if(scale!=null){c.style.transition='transform '+sec+'s ease-in-out';c.style.transform='scale('+scale+')';}
  let left=sec;$('#bcount').textContent=left;
  const iv=setInterval(()=>{
   if(id!==breathRun||!$('#bcircle')){clearInterval(iv);return res(false);}
   left--;
   if(left>0)$('#bcount').textContent=left;else{clearInterval(iv);res(true);}
  },1000);
 });
}
async function runBreath(){
 const id=++breathRun,p=BREATH[ui.bs],secs=isShort('respi')?60:120,t0=Date.now();
 const chrono=()=>{const e=$('#bchrono');if(e)e.textContent=fmtDur(Math.max(0,secs-Math.floor((Date.now()-t0)/1000)));};
 chrono();
 const iv=setInterval(()=>{if(id!==breathRun||!$('#bchrono')){clearInterval(iv);return;}chrono();},250);
 document.querySelectorAll('[data-act=complete]').forEach(b=>b.classList.remove('pulse'));
 let ok=true;
 while(ok&&(Date.now()-t0)/1000<secs-1){
  ok=await phase(id,'Inspire',p.inh,1);
  if(ok&&p.hold)ok=await phase(id,'Retiens',p.hold,null);
  if(ok)ok=await phase(id,'Expire',p.exh,0.55);
  if(ok&&p.hold2)ok=await phase(id,'Pause',p.hold2,null);
 }
 clearInterval(iv);
 if(!ok||id!==breathRun)return;
 const e=$('#bchrono');if(e)e.textContent='00:00';
 if($('#blabel')){$('#blabel').textContent='Bravo ✨ Tu peux valider';$('#bcount').textContent='';}
 document.querySelectorAll('[data-act=complete]').forEach(b=>b.classList.add('pulse'));
 try{navigator.vibrate&&navigator.vibrate(200);}catch(x){}
}
function runTimer(sec){
 const id=++timerRun,fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);let left=sec;
 const el=$('#tdisp');if(el)el.textContent=fmt(left);
 const iv=setInterval(()=>{
  const e=$('#tdisp');
  if(id!==timerRun||!e){clearInterval(iv);return;}
  left--;
  if(left<=0){clearInterval(iv);e.textContent='Terminé ✨';try{navigator.vibrate&&navigator.vibrate(200);}catch(x){}}
  else e.textContent=fmt(left);
 },1000);
}

  let ph=($('#ob_ph').value||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!ph.length)ph=[id];
  const st=S.settings;st.name=($('#ob_name').value||'').trim();st.identity=id;st.wake=$('#ob_wake').value||'06:45';st.bed=$('#ob_bed').value||'23:00';
  st.times.matin=st.wake;st.first=today();st.onboarded=true;S.phrases=ph;
  cacheLocal();render();try{window.scrollTo(0,0);}catch(e){}
 },
 install(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;render();}},
 importjson(){try{const o=JSON.parse($('#importjson').value);if(!o||!o.S)throw 0;S=normSettings(o.S);S.settings.onboarded=true;months=o.months||{};cacheLocal();render();toast('Sauvegarde restaurée');}catch(e){toast('Sauvegarde non reconnue');}},
 reset(){if(!ui.resetArm){ui.resetArm=true;render();return;}try{localStorage.removeItem(LS);}catch(e){}S=DEF();months={};ui.resetArm=false;render();},
 tab(el){ui.tab=el.dataset.v;render();window.scrollTo(0,0);},
 open(el){openSheet(el.dataset.step);},
 soscat(el){ui.sosc=+el.dataset.i;render();},
 closeSheet(){closeSheet();},
 complete(el){complete(el.dataset.step);},
 quick(el){const d=dayOf(today(),true);d.done[el.dataset.step]=true;delete d.rep[el.dataset.step];touchDay(today());render();toast('Bien joué ✨');checkPaliers();},
 undo(el){const d=dayOf(today(),true);delete d.done[el.dataset.step];touchDay(today());render();},
 report(el){const d=dayOf(today(),true);d.rep[el.dataset.step]=true;touchDay(today());render();toast('Reporté sans culpabilité 🌿');},
 unreport(el){const d=dayOf(today(),true);delete d.rep[el.dataset.step];touchDay(today());render();},
 short(el){const d=dayOf(today(),true),id=el.dataset.step;if(d.short[id])delete d.short[id];else d.short[id]=true;touchDay(today());render();},
 allshort(){const d=dayOf(today(),true);REQUIRED.forEach(s=>{if(!isDone(d,s.id))d.short[s.id]=true;});touchDay(today());render();toast('Journée allégée');},
 lighten(){S.settings.limit=45;saveMain();render();toast('Charge limitée à 45 min');},
 catch(){
  const r=rattrapage();if(!r||r.done)return;
  const t=today(),yd=dayOf(r.from,true),td=dayOf(t,true);
  yd.done[r.step]='rattrape';td.rattrape={step:r.step,from:r.from};
  touchDay(r.from);touchDay(t);render();toast('Rattrapé 🌿');checkPaliers();
 },
 selday(el){ui.selday=el.dataset.d;render();},
 calprev(){const p=ui.cal.split('-').map(Number);const d=new Date(p[0],p[1]-2,1);ui.cal=ymd(d).slice(0,7);ui.selday=null;render();},
 calnext(){const p=ui.cal.split('-').map(Number);const d=new Date(p[0],p[1],1);ui.cal=ymd(d).slice(0,7);ui.selday=null;render();},
 addproof(){
  const el=$('#newproof'),t=(el.value||'').trim();if(!t)return;
  dayOf(today(),true).proofs.push({t:t});touchDay(today());render();toast('Preuve ajoutée 🏆');
 },
 import(){
  const lines=($('#importbox').value||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return;
  S.imported=S.imported.concat(lines);saveMain();render();toast(lines.length+' preuves importées');
 },
 addphrase(){const el=$('#newphrase'),t=(el.value||'').trim();if(!t)return;S.phrases.push(t);saveMain();render();},
 delphrase(el){if(S.phrases.length<=1){toast('Garde au moins une phrase');return;}S.phrases.splice(+el.dataset.i,1);saveMain();render();},
 fav(el){const i=S.favs.indexOf(el.dataset.id);if(i>=0)S.favs.splice(i,1);else S.favs.push(el.dataset.id);saveMain();render();},
 export(){
  const box=$('#exportbox');box.hidden=false;
  box.value=JSON.stringify({S:S,months:months});
  box.select();
  try{navigator.clipboard.writeText(box.value).then(()=>toast('Sauvegarde copiée'),()=>{});}catch(e){}
 },
 mprev(){ui.mi=Math.max(0,ui.mi-1);renderSheet();},
 mnext(){ui.mi=Math.min(S.phrases.length-1,ui.mi+1);renderSheet();},
 bstate(el){stopRuns();ui.bs=el.dataset.k;renderSheet();},
 breath(){runBreath();},
 timer(el){runTimer(+el.dataset.sec);},
 obj(el){const i=$('#objtxt');if(i)i.value=el.dataset.t;},
 axe(el){ui.axe=el.dataset.k;const cur=($('#biztxt')||{}).value||'';renderSheet();const i=$('#biztxt');if(i)i.value=cur;},
 bizs(el){const i=$('#biztxt');if(i)i.value=el.dataset.t;},
 fat(el){ui.fat=el.dataset.k;renderSheet();},
 bilan(el){const pr=($('#bilanproof')||{}).value||'';ui.bilan=el.dataset.k;renderSheet();const i=$('#bilanproof');if(i)i.value=pr;}
};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(ui.tab==='me'&&!ui.sheet&&S.settings.onboarded)render();});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const f=A[el.dataset.act];if(f){try{f(el);}catch(err){toast('Oups : '+(err&&err.message?err.message:err));}}
});
document.addEventListener('input',e=>{
 const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;
 const v=e.target.value,st=S.settings;
 if(k==='identity')st.identity=v;
 else if(k==='name')st.name=v.trim();
 else if(k==='song')st.song=v.trim();
 else if(k==='limit'){const n=parseInt(v,10);if(n>=20&&n<=240)st.limit=n;else return;}
 else if(k==='wake'||k==='bed')st[k]=v;
 else if(k.indexOf('t_')===0)st.times[k.slice(2)]=v;
 saveMain();
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='recfile'&&e.target.files&&e.target.files[0])setDraft(e.target.files[0],0);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!ui.sheet)render();});

loadLocal();
render();
loadClips();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script>
</body>
</html>
